name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use a throwaway unlocked keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci agent-switch-ci.keychain
          security set-keychain-settings agent-switch-ci.keychain
          security unlock-keychain -p ci agent-switch-ci.keychain
          security list-keychains -d user -s agent-switch-ci.keychain
          security default-keychain -d user -s agent-switch-ci.keychain
      - run: npm test
        timeout-minutes: 10
        env:
          # Only CI may write to the macOS Keychain.
          AGENT_SWITCH_KEYCHAIN_TEST: ${{ runner.os == 'macOS' && '1' || '' }}
